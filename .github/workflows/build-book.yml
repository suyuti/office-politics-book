name: Build Book PDF

on:
  push:
    branches:
      - main
      - draft
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install Montserrat font
        run: |
          sudo mkdir -p /usr/local/share/fonts/truetype/montserrat
          sudo curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Regular.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Regular.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Bold.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Bold.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Italic.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Italic.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-BoldItalic.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-BoldItalic.ttf"
          fc-cache -fv

      - name: Create build directories
        run: |
          mkdir -p build/merged
          mkdir -p build/pdf

      - name: Merge chapters
        run: bash tools/scripts/merge-chapters.sh

      - name: Build PDF
        run: bash tools/scripts/build-book.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-politics-book-pdf
          path: build/pdf/book.pdf
