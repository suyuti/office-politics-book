name: Build Book PDF

on:
  push:
    branches:
      - main
      - draft
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install Montserrat font
        run: |
          sudo mkdir -p /usr/local/share/fonts/truetype/montserrat
          sudo curl -fsSL "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Regular.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Regular.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Bold.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Bold.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Italic.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-Italic.ttf"
          sudo curl -fsSL "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-BoldItalic.ttf" \
            -o "/usr/local/share/fonts/truetype/montserrat/Montserrat-BoldItalic.ttf"
          fc-cache -fv

      - name: Create build directories
        run: |
          mkdir -p build/merged
          mkdir -p build/pdf
          mkdir -p output

      - name: Merge chapters
        run: bash tools/scripts/merge-chapters.sh

      - name: Build PDF
        run: bash tools/scripts/build-book.sh

      - name: Determine versioned PDF filename
        id: pdf_version
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          GIT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BUILD_DATE}-${GIT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=book-${VERSION}.pdf" >> "$GITHUB_OUTPUT"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-politics-book-${{ steps.pdf_version.outputs.version }}
          path: output/${{ steps.pdf_version.outputs.filename }}

      - name: Prune old PDFs (keep latest 5)
        run: |
          cd output
          ls -t book-*.pdf 2>/dev/null | tail -n +6 | xargs -r git rm -f --
          cd ..

      - name: Commit versioned PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No new PDF to commit."
          else
            git commit -m "build: add versioned PDF output/${{ steps.pdf_version.outputs.filename }}"
            git push
          fi
